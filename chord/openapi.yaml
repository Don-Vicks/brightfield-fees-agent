openapi: 3.0.3
info:
  title: Brightfield Academy fees tools
  version: 1.0.0
  description: >
    Tools for a WhatsApp fees assistant. Check a student's fee balance, create a
    Paystack (test mode) payment link, and verify that a payment went through.
    Every response includes agent_hint, which says what to tell the parent next.
servers:
  - url: https://brightfield-fees-agent.vercel.app
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: AMOUNT_TOO_LOW }
            message: { type: string }
            agent_hint: { type: string }
paths:
  /api/balance:
    get:
      operationId: get_fee_balance
      summary: Look up a student's fee balance for the current term
      description: >
        Returns total fees, amount paid, remaining balance, minimum installment,
        due date and fee breakdown. Call when a parent asks what they owe, and
        before creating a payment link.
      parameters:
        - name: student_id
          in: query
          required: true
          description: Student ID, e.g. BFA-0142
          schema: { type: string }
        - name: parent_phone
          in: query
          required: false
          description: "The parent's WhatsApp number (the sender of this chat), e.g. +2348035550142. Only answers for that parent's own children."
          schema: { type: string }
      responses:
        '200':
          description: Fee account
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  student_id: { type: string }
                  student_name: { type: string }
                  total_fees: { type: integer, description: naira }
                  amount_paid: { type: integer, description: naira }
                  balance: { type: integer, description: naira }
                  min_installment: { type: integer, description: naira }
                  due_date: { type: string }
                  summary: { type: string }
                  agent_hint: { type: string }
        '404':
          description: Student not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/payment-link:
    post:
      operationId: create_payment_link
      summary: Create a Paystack payment link for school fees
      description: >
        Amount in naira. Must be at least the minimum installment (100000) unless
        it equals the full remaining balance, and cannot exceed the balance.
        Send payment_url to the parent exactly as returned; keep reference for verify_payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, amount]
              properties:
                student_id: { type: string, description: 'Student ID, e.g. BFA-0142' }
                amount: { type: number, description: 'Amount in naira, e.g. 150000' }
                parent_phone: { type: string, description: "The parent's WhatsApp number (the sender of this chat), e.g. +2348035550142. Only answers for that parent's own children." }
      responses:
        '200':
          description: Link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reference: { type: string }
                  payment_url: { type: string }
                  amount: { type: integer }
                  balance_after_payment: { type: integer }
                  agent_hint: { type: string }
        '409':
          description: Already fully paid
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Amount below minimum or above balance
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Paystack unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/verify:
    post:
      operationId: verify_payment
      summary: Check whether a payment went through and get the new balance
      description: >
        Pass reference (preferred) or student_id. payment_status is success,
        failed, not_completed or reversed. Only confirm to the parent on success.
        On success, receipt_url opens the parent's receipt (image + Download button);
        receipt_image_url is the PNG itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string }
                student_id: { type: string }
                parent_phone: { type: string, description: "The parent's WhatsApp number (the sender of this chat), e.g. +2348035550142. Only answers for that parent's own children." }
      responses:
        '200':
          description: Verification result (including failed or unfinished payments)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  payment_status: { type: string, enum: [success, failed, not_completed, reversed, unknown] }
                  amount: { type: integer }
                  new_balance: { type: integer }
                  receipt_url: { type: string, description: 'Receipt page with the image and a Download button. Only when payment_status is success' }
                  receipt_image_url: { type: string, description: 'The receipt as a PNG image. Only when payment_status is success' }
                  agent_hint: { type: string }
        '404':
          description: Reference or payment not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/payments:
    get:
      operationId: get_payment_history
      summary: Payment history and receipts for a student this term
      description: >
        Everything paid this term for a Brightfield Academy student: the total paid at the bursary and every online payment with its date, amount and receipt_url. Call it when a parent asks what they have paid, wants their payment history, or has lost a receipt. Send receipt_url exactly as given. Bursary payments have no online receipt.
      parameters:
        - name: student_id
          in: query
          required: true
          description: Student ID, e.g. BFA-0142
          schema: { type: string }
        - name: parent_phone
          in: query
          required: false
          description: "The parent's WhatsApp number (the sender of this chat). Only answers for that parent's own children."
          schema: { type: string }
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  paid_at_bursary: { type: integer, description: naira }
                  paid_online: { type: integer, description: naira }
                  balance: { type: integer, description: naira }
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        reference: { type: string }
                        amount: { type: integer }
                        paid_at: { type: string }
                        receipt_url: { type: string }
                  other_attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        reference: { type: string }
                        amount: { type: integer }
                        status: { type: string, enum: [failed, not_completed, reversed] }
                  agent_hint: { type: string }
        '404':
          description: Student not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/handover:
    post:
      operationId: hand_over_to_bursar
      summary: Pass a case to the school bursar (a human)
      description: >
        Pass a case to the school bursar (a human) when the parent needs something you can't do: a disputed balance or missing payment, a refund or double charge, a discount, scholarship or deadline extension, a reversed or unclear payment, an upset parent or sensitive situation, a non-fee question, or the payment system being down. Returns a handover_id to give the parent. Never promise an outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: { type: string, description: 'One or two sentences for the bursar: what the parent needs and any useful detail' }
                reason: { type: string, enum: [dispute, refund, discount, deadline, missing_payment, reversed_payment, sensitive, not_fees, system_down, other] }
                student_id: { type: string, description: "The child's student ID, if known" }
                parent_phone: { type: string, description: "The parent's WhatsApp number (the sender of this chat)" }
                reference: { type: string, description: 'A payment reference involved, if any' }
      responses:
        '200':
          description: Handover recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  handover_id: { type: string }
                  delivered: { type: string, enum: [webhook, log] }
                  agent_hint: { type: string }
        '400':
          description: Missing summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
